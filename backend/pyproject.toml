[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "myward-backend"
version = "2.0.0"
description = "AI-powered digital wardrobe & outfit recommendation system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enochrwa", email = "enockuwumukiza850@gmail.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database - PostgreSQL
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",

    # Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",

    # ML / Image
    "pillow>=11.0.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "opencv-python-headless>=4.10.0",
    "rembg>=2.0.57",

    # HTTP / Async
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2025.1",
    "ujson>=5.10.0",
    "orjson>=3.10.0",
    "redis>=5.2.0",
    "celery>=5.4.0",

    # Monitoring
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
    "types-pytz>=2025.1",
    "types-aiofiles>=24.1.0",
]

[project.scripts]
myward = "myward.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# ─── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "ANN", # flake8-annotations
    "RUF", # ruff-specific
]
ignore = [
    "ANN101", # missing self type annotation
    "ANN102", # missing cls type annotation
    "S101",   # assert usage in tests
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S106"]
"src/myward/db/migrations/**/*.py" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["myward"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "rembg.*",
    "sklearn.*",
    "torch.*",
    "torchvision.*",
    "PIL.*",
    "celery.*",
    "redis.*",
]
ignore_missing_imports = true

# ─── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=src/myward",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-v",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ─── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/myward"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
