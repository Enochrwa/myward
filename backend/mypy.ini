[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True
warn_unused_ignores = True
show_error_codes = True
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-rembg.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True
